name: tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector (path / node id) to run only those tests"
        type: string
        required: false
        default: ''

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Environment variables to support color support (jaraco/skeleton#66):
  # Request colored output from CLI tools supporting it. Different tools
  # interpret the value differently. For some, just being set is sufficient.
  # For others, it must be a non-zero integer. For yet others, being set
  # to a non-empty value is sufficient. For tox, it must be one of
  # <blank>, 0, 1, false, no, off, on, true, yes. The only enabling value
  # in common is "1".
  FORCE_COLOR: 1
  # MyPy's color enforcement (must be a non-zero number)
  MYPY_FORCE_COLOR: -42
  # Recognized by the `py` package, dependency of `pytest` (must be "1")
  PY_COLORS: 1
  # Make tox-wrapped tools see color requests
  TOX_TESTENV_PASSENV: >-
    FORCE_COLOR
    MYPY_FORCE_COLOR
    NO_COLOR
    PY_COLORS
    PYTEST_THEME
    PYTEST_THEME_MODE

  # Suppress noisy pip warnings
  PIP_DISABLE_PIP_VERSION_CHECK: 'true'
  PIP_NO_PYTHON_VERSION_WARNING: 'true'
  PIP_NO_WARN_SCRIPT_LOCATION: 'true'

  # Disable the spinner, noise in GHA; TODO(webknjaz): Fix this upstream
  # Must be "1".
  TOX_PARALLEL_NO_SPINNER: 1

  # tox 4 overrides (entries split on ';', not stripped):
  # - deprecation due dates in this release have passed; warn, don't raise
  #   (key must be `setenv` as spelled in tox.ini, else the whole block is replaced)
  # - resolve the test stack from the release-era (2023-09-13) index
  TOX_OVERRIDE: "testenv.setenv+=SETUPTOOLS_ENFORCE_DEPRECATION=0;\
    testenv.install_command=python -I -m pip install \
    --index-url https://:2023-09-13@time-machines-pypi.sealsecurity.io/ \
    {opts} {packages}"


jobs:
  build:
    # Replicates `tox -e release` minus the upload / GitHub release steps.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        # `saveopts` is resolved from an INSTALLED setuptools' entry points
        run: >-
          python -m pip install
          --index-url 'https://:2023-09-13@time-machines-pypi.sealsecurity.io/'
          build setuptools==68.2.1
      - name: Clean dist
        run: python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - name: Unset tag_build and tag_date (pypa/setuptools#2500)
        run: python setup.py egg_info -Db "" saveopts
      - name: Build sdist and wheel
        env:
          # backend requests `wheel` dynamically in the isolated env;
          # the reference WHEEL file says bdist_wheel (0.41.2)
          PIP_INDEX_URL: https://:2023-09-13@time-machines-pypi.sealsecurity.io/
          PIP_CONSTRAINT: ${{ runner.temp }}/build-constraints.txt
        run: |
          echo "wheel==0.41.2" > "$PIP_CONSTRAINT"
          python -m build
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        python:
        - "3.8"
        - "3.11"
        - "3.12"
        platform:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        include:
        - python: "3.9"
          platform: ubuntu-latest
        - python: "3.10"
          platform: ubuntu-latest
        - python: pypy3.9
          platform: ubuntu-latest
          distutils: stdlib
        - platform: ubuntu-latest
          python: "3.10"
          distutils: stdlib
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        id: python-install
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Setup Python (macOS arm64; old CPython may need a source build)
        id: python-install-macos
        if: runner.os == 'macOS'
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          cache-build: true
          allow-build: allow
      - uses: actions/cache@v4
        id: cache
        with:
          path: setuptools/tests/config/downloads/*.cfg
          key: >-
            ${{ hashFiles('setuptools/tests/config/setupcfg_examples.txt') }}-
            ${{ hashFiles('setuptools/tests/config/downloads/*.py') }}
      - name: Populate download cache
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: setuptools/tests/config
        run: python -m downloads.preload setupcfg_examples.txt
      - name: Install tox
        run: |
          python -m pip install --index-url 'https://:2023-09-13@time-machines-pypi.sealsecurity.io/' tox
      - name: Run
        # --color=no: keep the "N passed" summary readable in the log
        # -p no:black/ruff/checkdocs: lint gates collected as pytest items
        #   (pytest-enabler then skips --black/--ruff, it checks has_plugin)
        # --ignore=exercises.py: pytest-perf breaks on the fork checkout dir
        # --deselect test_pbr: easy_install fetches the newest pbr from live
        #   PyPI (cannot be time-pinned), which no longer ships pbr/core.py
        # --timeout: turn a hung test into a reported failure
        # SETUPTOOLS_USE_DISTUTILS is scoped to this step: job-wide it breaks
        #   setup-python's pip upgrade on 3.8 (old _distutils_hack KeyError)
        env:
          SETUPTOOLS_USE_DISTUTILS: ${{ matrix.distutils || 'local' }}
        run: >-
          tox --
          --color=no
          -p no:black -p no:ruff -p no:checkdocs
          --ignore=exercises.py
          --deselect setuptools/tests/test_integration.py::test_pbr
          --timeout=600
          ${{ inputs.test-filter }}

  docs:
    # sphinx -W + sphinxlint is a docs/lint gate, not a test
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOXENV: docs
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
      - name: Install tox
        run: |
          python -m pip install tox
      - name: Run
        run: tox

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
    - build
    - integration-test
    - test
    - test_cygwin

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        allowed-skips: integration-test
        jobs: ${{ toJSON(needs) }}

  test_cygwin:
    strategy:
      matrix:
        python:
        - 39
        platform:
        - windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Cygwin with Python
        uses: cygwin/cygwin-install-action@v2
        with:
          platform: x86_64
          packages: >-
            python${{ matrix.python }},
            python${{ matrix.python }}-devel,
            python${{ matrix.python }}-tox,
            python${{ matrix.python }}-pip,
            gcc-core,
            git,
      - name: Record the currently selected Python version
        id: python-install
        # NOTE: This roughly emulates what `actions/setup-python@v4` provides
        # NOTE: except the action gets the version from the installation path
        # NOTE: on disk and we get it from runtime.
        run: |
          python -c 'import platform; print("python-version=" + platform.python_version())' >> ${GITHUB_OUTPUT}
        shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
      - name: Run tests
        env:
          # cygwin's tox 4.24 / virtualenv 20.36 seed pip 25.3, which dropped the
          # legacy setup.py build the fetch_build_egg/setup_requires tests need
          # (isolated build can't find setuptools in their local index); pin the
          # release-era pip 23.2.1 the other legs get (same overrides as above)
          TOX_OVERRIDE: "testenv.setenv+=SETUPTOOLS_ENFORCE_DEPRECATION=0;\
            testenv.install_command=python -I -m pip install \
            --index-url https://:2023-09-13@time-machines-pypi.sealsecurity.io/ \
            {opts} {packages};\
            testenv.commands_pre=python -I -m pip install \
            --index-url https://:2023-09-13@time-machines-pypi.sealsecurity.io/ \
            pip==23.2.1"
        shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
        run: |
          git config --global --add safe.directory "$(cygpath -u "$GITHUB_WORKSPACE")" # workaround for #3408
          # cygwin's python39-tox package is missing its tomli dependency
          python -m pip install --index-url 'https://:2023-09-13@time-machines-pypi.sealsecurity.io/' tomli
          tox --version
          tox -- --color=no -p no:black -p no:ruff -p no:checkdocs --ignore=exercises.py --deselect setuptools/tests/test_integration.py::test_pbr --timeout=600 ${{ inputs.test-filter }}

  integration-test:
    needs: test
    # A non-empty test-filter scopes the run to the selected unit tests only;
    # `check` allows this job to be skipped.
    if: github.event_name == 'workflow_dispatch' && inputs.test-filter == ''
    # To avoid long times and high resource usage, we assume that:
    # 1. The setuptools APIs used by packages don't vary too much with OS or
    #    Python implementation
    # 2. Any circumstance for which the previous assumption is not valid is
    #    already tested via unit tests (or other tests not classified here as
    #    "integration")
    # With that in mind, the integration tests can run for a single setup
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install OS-level dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential gfortran libopenblas-dev libyaml-dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Use a release that is not very new but still have a long life:
          python-version: "3.10"
      - name: Install tox
        run: |
          python -m pip install --index-url 'https://:2023-09-13@time-machines-pypi.sealsecurity.io/' tox
      - name: Run integration tests
        run: tox -e integration -- --color=no -vv --durations=10

  release:
    permissions:
      contents: write
    needs:
    - check
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install tox
        run: |
          python -m pip install tox
      - name: Run
        run: tox -e release
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
